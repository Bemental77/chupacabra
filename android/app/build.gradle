apply plugin: 'com.android.application'
apply plugin: 'com.facebook.react'

android {
    namespace "com.chupacabra"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.chupacabra"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
            "APPAUTH_REDIRECT_SCHEME": "com.chupacabra"
        ]
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
    }
}

dependencies {
    // React Native
    implementation "com.facebook.react:react-native:$reactNativeVersion"

    // Android Support Libraries
    implementation "androidx.appcompat:appcompat:${androidxAppcompatVersion}"
    implementation "androidx.browser:browser:${androidxBrowserVersion}"
    implementation "androidx.constraintlayout:constraintlayout:${androidxConstraintLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${splashscreenVersion}"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:${firebaseBomVersion}")

    // Testing
    testImplementation "junit:junit:${junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${espressoCoreVersion}"
}

task copyDownloadableDepsToLibs(type: Copy) {
    from "${react.nodeModulesDir}/react-native/android"
    into "${projectDir}/libs"
    include "*.aar"
    include "*.jar"
}

afterEvaluate { project ->
    tasks.preBuild.dependsOn copyDownloadableDepsToLibs
}
